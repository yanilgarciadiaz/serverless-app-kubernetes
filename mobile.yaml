apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile
  template:
    metadata:
      labels:
        app: mobile
    spec:
      containers:
      - name: mobile
        image: kbt-mobile:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-service
spec:
  type: LoadBalancer
  selector:
    app: mobile
  ports:
  - port: 80
    targetPort: 80